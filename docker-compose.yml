services:
  back:
    build: ./back
    ports:
      - "8000:8000"
    environment:
      STUDENTCARE_JWT_SECRET: troque-esta-chave-em-producao
      CORS_ORIGINS: http://localhost:3000
      # Gatilho automático: LIGADO por decisão explícita do usuário deste
      # deploy. O modelo classifica posturas de terapia, não crise — isto
      # dispara um alerta sempre que a confiança de QUALQUER uma das 11
      # posturas passar de GATILHO_CONFIANCA_MINIMA, não só em crises reais.
      # Ver aviso completo em back/src/control/deteccao.py.
      GATILHO_AUTOMATICO_ATIVO: "true"
      GATILHO_CONFIANCA_MINIMA: "0.7"
      GATILHO_COOLDOWN_SEGUNDOS: "60"
    volumes:
      - back_data:/app/data
    # Acesso à webcam do host (Linux). Muitas câmeras expõem mais de um
    # /dev/videoN (um é o feed de imagem de verdade, outro é metadado) —
    # por isso passamos várias; escolha o índice certo pelo campo "Índice
    # da câmera" no Painel do Professor. Remova as linhas se a máquina não
    # tiver câmera. Não funciona no Docker Desktop (Mac/Windows), que não
    # expõe /dev/videoN ao container.
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    networks:
      - studentcare

  front:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_USE_MOCK: "false"
    ports:
      - "3000:3000"
    depends_on:
      - back
    networks:
      - studentcare

networks:
  studentcare:
    driver: bridge

volumes:
  back_data:
